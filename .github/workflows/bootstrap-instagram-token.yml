name: Bootstrap Instagram Token

on:
  workflow_dispatch:
    inputs:
      short_lived_token:
        description: >
          Short-lived User Access Token from
          https://developers.facebook.com/tools/explorer/
          (instagram_basic + instagram_content_publish permissions)
        required: true
        type: string

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
    - name: Mask token input
      # Workflow inputs are not auto-masked like secrets, and each step's env
      # block is echoed to the log. Mask here, before any step that uses it.
      # Read from the event payload so this step's own env doesn't leak it.
      run: echo "::add-mask::$(jq -r '.inputs.short_lived_token' "$GITHUB_EVENT_PATH")"

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pynacl

    - name: Exchange for long-lived token and update secret
      env:
        FACEBOOK_APP_ID: "1914060772854547"
        FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
        SHORT_LIVED_TOKEN: ${{ inputs.short_lived_token }}
        GITHUB_TOKEN: ${{ secrets.RENEWAL_PAT }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
      run: |
        python - <<'EOF'
        import os, sys, requests, base64, logging
        from datetime import datetime
        from nacl import encoding, public

        logging.basicConfig(level=logging.INFO, format='%(asctime)s - %(levelname)s - %(message)s')
        logger = logging.getLogger(__name__)

        app_id     = os.environ["FACEBOOK_APP_ID"]
        app_secret = os.environ["FACEBOOK_APP_SECRET"]
        token      = os.environ["SHORT_LIVED_TOKEN"]
        gh_token   = os.environ["GITHUB_TOKEN"]
        repo       = os.environ["GITHUB_REPOSITORY"]
        ig_id      = os.environ.get("INSTAGRAM_ACCOUNT_ID", "")

        # Exchange short-lived token for a 60-day long-lived token
        logger.info("🔄 Exchanging for long-lived token...")
        r = requests.get(
            "https://graph.facebook.com/v18.0/oauth/access_token",
            params={"grant_type": "fb_exchange_token", "client_id": app_id,
                    "client_secret": app_secret, "fb_exchange_token": token},
            timeout=30,
        )
        r.raise_for_status()
        data = r.json()
        new_token = data.get("access_token")
        if not new_token:
            logger.error(f"❌ No token in response: {data}")
            sys.exit(1)
        days = data.get("expires_in", 0) // 86400
        logger.info(f"✅ Long-lived token obtained — valid for {days} days")

        # Prefer the Page token for the Page linked to INSTAGRAM_ACCOUNT_ID: page
        # tokens derived from a long-lived user token don't expire, whereas the
        # user token lasts ~60 days and can't be extended by re-exchanging it.
        store_token = new_token
        logger.info("🔎 Looking up Page linked to INSTAGRAM_ACCOUNT_ID...")
        url = "https://graph.facebook.com/v18.0/me/accounts"
        params = {"fields": "name,access_token,instagram_business_account", "access_token": new_token}
        page = None
        while url and not page:
            ar = requests.get(url, params=params, timeout=30)
            ar.raise_for_status()
            adata = ar.json()
            page = next((p for p in adata.get("data", [])
                         if ig_id and p.get("instagram_business_account", {}).get("id") == ig_id), None)
            url, params = adata.get("paging", {}).get("next"), None
        if page:
            store_token = page["access_token"]
            logger.info(f"✅ Using Page token for '{page['name']}'")
        else:
            print("::warning::No Page linked to INSTAGRAM_ACCOUNT_ID found (needs pages_show_list); "
                  "storing the ~60-day user token instead")

        # Verify it
        logger.info("🔍 Verifying token...")
        vr = requests.get(
            "https://graph.facebook.com/v18.0/debug_token",
            params={"input_token": store_token, "access_token": store_token},
            timeout=30,
        )
        vr.raise_for_status()
        vdata = vr.json().get("data", {})
        if not vdata.get("is_valid"):
            logger.error("❌ New token failed verification")
            sys.exit(1)
        expires_at = vdata.get("expires_at", 0)
        expiry = datetime.fromtimestamp(expires_at).strftime("%Y-%m-%d") if expires_at else "never"
        logger.info(f"✅ Token verified ({vdata.get('type')}, expires: {expiry})")

        # Get repo public key
        owner, repo_name = repo.split("/")
        headers = {"Authorization": f"token {gh_token}",
                   "Accept": "application/vnd.github.v3+json",
                   "User-Agent": "PyASAN-Bootstrap/1.0"}
        pk_r = requests.get(
            f"https://api.github.com/repos/{owner}/{repo_name}/actions/secrets/public-key",
            headers=headers, timeout=30,
        )
        if pk_r.status_code == 401:
            logger.error("❌ GitHub 401 — RENEWAL_PAT is expired or invalid")
            logger.error("💡 Regenerate the PAT at GitHub → Settings → Developer settings → Personal access tokens")
            sys.exit(1)
        pk_r.raise_for_status()
        pk_data = pk_r.json()

        # Encrypt and upload
        pub_key = public.PublicKey(pk_data["key"].encode(), encoding.Base64Encoder())
        encrypted = base64.b64encode(public.SealedBox(pub_key).encrypt(store_token.encode())).decode()
        up_r = requests.put(
            f"https://api.github.com/repos/{owner}/{repo_name}/actions/secrets/INSTAGRAM_ACCESS_TOKEN",
            headers=headers,
            json={"encrypted_value": encrypted, "key_id": pk_data["key_id"]},
            timeout=30,
        )
        if up_r.status_code == 401:
            logger.error("❌ GitHub 401 writing secret — RENEWAL_PAT is expired or invalid")
            sys.exit(1)
        up_r.raise_for_status()
        logger.info("🎉 INSTAGRAM_ACCESS_TOKEN secret updated successfully!")
        logger.info(f"⏰ Token expires: {expiry}")
        EOF
