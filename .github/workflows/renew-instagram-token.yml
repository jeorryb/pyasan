name: Renew Instagram Access Token

on:
  schedule:
    # Run daily at 9:00 AM UTC
    - cron: '0 9 * * *'
  workflow_dispatch:  # Allow manual triggering

jobs:
  renew-token:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pynacl
    
    - name: Check and renew token if needed
      id: renewal
      env:
        INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        FACEBOOK_APP_ID: "1914060772854547"
        FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
        GITHUB_TOKEN: ${{ secrets.RENEWAL_PAT }}
      run: |
        python scripts/renew_instagram_token.py 2>&1 | tee token_renewal.log
        
        # Check if manual update is required
        if grep -q "MANUAL UPDATE REQUIRED" token_renewal.log; then
          echo "manual_update_needed=true" >> $GITHUB_OUTPUT
        else
          echo "manual_update_needed=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Upload renewal logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: token-renewal-logs
        path: token_renewal.log
        retention-days: 7
    
    - name: Notify if manual update needed (triggers email)
      if: steps.renewal.outputs.manual_update_needed == 'true'
      run: |
        echo "::error::🔔 INSTAGRAM TOKEN RENEWAL REQUIRED!"
        echo "::error::Automatic secret rotation failed — see logs for the specific cause."
        echo "::error::"
        echo "::error::Most likely cause: RENEWAL_PAT has expired."
        echo "::error::Fix: Go to GitHub → Settings → Developer settings → Personal access tokens"
        echo "::error::     Regenerate the PAT with 'Secrets: Read and write' on this repo,"
        echo "::error::     then update the RENEWAL_PAT secret."
        echo "::error::"
        echo "::error::If the token itself is expired, use the bootstrap workflow:"
        echo "::error::  https://github.com/${{ github.repository }}/actions/workflows/bootstrap-instagram-token.yml"
        echo "::error::  → Run workflow → paste a fresh short-lived token from"
        echo "::error::    https://developers.facebook.com/tools/explorer/"
        echo ""
        echo "::warning::The workflow will continue to fail until the secret is updated."
        exit 1
