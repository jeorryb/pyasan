name: APOD Archive Canary

# Weekly check that NASA's science.nasa.gov APOD pages still parse. The daily
# Instagram post scrapes these pages, so if NASA changes the markup this goes
# red on its own schedule instead of the daily post failing without warning.

on:
  schedule:
    - cron: '0 14 * * 1'  # Mondays 14:00 UTC
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Check live APOD pages still parse
      run: |
        pytest tests/test_apod_archive_live.py -m live -v
